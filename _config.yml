title: Rivnay Group
tagline: Laboratory for Organic & Hybrid Bioelectronics
description: The Rivnay Group at Northwestern University engineers organic bioelectronic materials, devices and systems that connect biology with electronics, from mixed ionic–electronic conductors to biohybrid living therapeutics.
url: https://rivnay.northwestern.edu
baseurl: ""   # the repo is the org site, so it serves from the root here and at the custom domain
lang: en
author: Rivnay Group
logo: /assets/img/og-image.jpg
timezone: America/Chicago

permalink: /news/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from   # old Squarespace URLs: redirect_from lists in the posts and pages
  - jekyll-sitemap         # /sitemap.xml and /robots.txt
  - jekyll-feed            # /feed.xml from _posts

exclude:
  - docs
  - assets/img/rivnay_logos
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default
  # section pages get a share image; posts are their own type and keep their own
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/img/og-image.jpg
