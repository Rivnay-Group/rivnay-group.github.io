# Logo files live in assets/img/logos/.
# `h` is the display height in px, set so every mark carries a similar visual area rather than a
# uniform height (a round seal needs to be taller than a wordmark to read as the same size).
# Recompute as 68 * (3 / aspect_ratio) ** 0.35; a mark wider than its cell is capped by max-width.
# Order follows the old Research page; Sloan (old Funding page) and MRSEC appended.
funders:
  - name: NSF, National Science Foundation
    logo: nsf.svg
    h: 100
    url: https://www.nsf.gov
  - name: NIH, National Institutes of Health
    logo: nih.png
    h: 95
    url: https://www.nih.gov
  - name: DARPA, Defense Advanced Research Projects Agency
    logo: darpa.png
    h: 81
    url: https://www.darpa.mil
  - name: bi[o]hub
    logo: biohub.svg
    h: 67
    url: https://biohub.org
  - name: ARPA-H, Advanced Research Projects Agency for Health
    logo: arpa-h.png
    h: 64
    url: https://arpa-h.gov
  - name: Air Force Office of Scientific Research
    logo: afosr.png
    h: 100
    url: https://www.afrl.af.mil/AFOSR/
  - name: Alfred P. Sloan Foundation
    logo: sloan-foundation.png
    h: 56
    url: https://sloan.org
  - name: Gates Foundation
    logo: gates-foundation.svg
    h: 46
    url: https://www.gatesfoundation.org
facilities:
  - name: Center for Advanced Regenerative Engineering
