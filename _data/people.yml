- name: Jonathan Rivnay
  role: Professor of Biomedical Engineering and Materials Science & Engineering
  group: pi
  email: jrivnay@northwestern.edu
  photo: jonathan-rivnay.jpg
  bio: |
    Jonathan earned his B.Sc. in 2006 from Cornell University (Ithaca, NY). He then moved to Stanford University (Stanford, CA), where he earned an M.Sc. and Ph.D. in Materials Science and Engineering studying structure and electronic transport properties of organic electronics materials. In 2012, he joined the Dept. of Bioelectronics at the École des Mines de Saint-Étienne in France as a Marie Curie postdoctoral fellow, working on conducting polymer-based devices for bioelectronic recording and stimulation. Jonathan spent 2015-2016 as a member of the research staff at the Palo Alto Research Center (Palo Alto, CA) before joining the Department of Biomedical Engineering at Northwestern University in 2017.

    He is a Full Professor in the [Department of Biomedical Engineering](https://www.mccormick.northwestern.edu/biomedical/) and the [Department of Materials Science & Engineering](https://www.mccormick.northwestern.edu/materials-science/), and Director of the [Living Electronics Initiative](https://researchcomm.northwestern.edu/research-news/2026/living-electronics-initiative-to-drive-bio-hybrid-tech.html) (LEI). He also holds affiliations with Northwestern's [Center for Synthetic Biology](https://syntheticbiology.northwestern.edu/) (CSB), the [Querrey Simpson Institute for Regenerative Engineering](https://renu.northwestern.edu/) (RENU), and the [Querrey Simpson Institute for Bioelectronics](https://bioelectronics.northwestern.edu/) (QSIB).
- name: Abhijith Surendran
  role: Research Assistant Professor
  group: faculty
  email: abhijith.surendran@northwestern.edu
  photo: abhijith-surendran.jpg
  bio: >
    Abhijith started his engineering journey during his undergrad at TKMCE, Kollam. He primarily focused on robotics, developing co-operating robots, self-balancing robots, and speech recognition. He launched his research career during his master’s in Nanotechnology at NIT Karnataka under the supervision of Prof. Anandhan Srinivasan. He worked on developing highly porous electro-spun polymer gel electrolytes for Li ion and Na ion batteries. Later he moved to a highly interdisciplinary team at NTU Singapore, working on various kinds of materials such as perovskites and organic semiconductors under the supervision of Prof. Leong Wei Lin. Thanks to the vibrant colleagues, he prolifically collaborated with various research teams and worked on developing photodetectors, OFETs, OECTs, and neuromorphic devices. He earned his PhD for revealing the fundamentals of ionic liquid doping for enhancing solid state OECT (SSOECT) performance. In the Rivnay Group, he is working on an implantable ‘living pharmacy’ called NTRAIN (Normalizing Timing of Rhythms Across Internal Networks of Circadian Clocks) that focuses on controlling the body’s sleep/wake cycles.
- name: Zach Hoegberg
  role: Research technician
  group: staff
  photo: zach-hoegberg.jpg
  bio: >
    Zach completed his undergraduate education in 2020 at the University of Illinois at Urbana-Champaign with a dual degree in Mechanical and Electrical Engineering. After working on large agricultural and construction equipment for several years at John Deere, he attended Northwestern University and received a Master's degree in Materials Science and Engineering in 2024. While completing his studies there he performed research on prosthetics and wearable sensors under Dr. Matty Major. He is currently part of the Oxygenation Team in the Rivnay group, supporting device builds and improvements.
- name: Michelle Lotz
  role: Lab manager
  group: staff
  photo: michelle-lotz.jpg
  website: https://www.michellelotz.com
  bio: >
    Michelle graduated from Alfred University in 2019 with a BS in Ceramic Engineering and a BFA in Sculpture. During her time as an undergraduate, Michelle researched under Dr. Alexis Clare, where she developed a photoluminescent silicate glass using zinc and copper additives. Before joining the Rivnay Group in 2024, she worked as a process engineer working with optical ceramics. In her free time, Michelle continues to make art with a variety of materials including silicone and resin. Her personal art website is www.michellelotz.com.
- name: Rachel Nolander
  role: Research technician
  group: staff
  email: rachel.nolander@northwestern.edu
  photo: rachel-nolander.jpg
  website: https://linkedin.com/in/rachel-nolander
  bio: >
    Rachel graduated from Northwestern University in 2026 with a B.S. in Biomedical Engineering with Departmental Honors. During her time at Northwestern, Rachel conducted research at the Northwestern Querrey Simpson Institute for Bioelectronics under Professor John A. Rogers. Her undergraduate honors thesis focused on strategies to extend the lifetime of bioresorbable millimeter-scale pacemakers. She is now interested in developing implantable biosensors for detecting inflammatory biomarkers. Outside of research, Rachel enjoys playing guitar, hiking, baking, and painting.
- name: Rhea William
  role: Research technician
  group: staff
  photo: rhea-william.jpg
  bio: |
    Rhea graduated with a Bachelor's in Biotechnology. As an undergraduate, she worked on synthetic biology and genetic engineering projects focused on engineering biological systems for sensing and biotechnology. She joined the Rivnay Group in 2025, where her work spans mammalian cell culture, in vitro assays, cell encapsulation, biomaterials, bioelectronics, and synthetic biology. Her current research focuses on integrating engineered cells with materials and devices and developing new approaches to cell stimulation. She is interested in the intersection of engineering, biology, and translational research. Outside of the lab, Rhea enjoys reading, dancing, and whatever happens to be her latest hyperfocus.
- name: Catherine Beaumont
  role: Postdoctoral researcher
  group: postdoc
  email: catherine.beaumont@northwestern.edu
  photo: catherine-beaumont.jpg
  website: http://www.linkedin.com/in/catherine-beaumont2
  bio: >
    Catherine earned her B.S. in Chemistry from Laval University, Canada, where she conducted undergraduate research in peptide synthesis under Professor Éric Biron and polymer chemistry with Professor Mario Leclerc. She continued her academic journey at Laval University, obtaining her M.Sc. in 2020 and her Ph.D. in 2024. During her Ph.D., under the guidance of Professor Leclerc, she developed innovative water-soluble polymers for printed organic electronics. In recognition of her work, she was awarded an NSERC postdoctoral fellowship and joined the Rivnay Group in 2024 as a postdoctoral scholar. Catherine develops functional polymers for bioelectronic devices and biological interfaces, combining synthetic polymer chemistry with electrochemical characterization and device integration. Outside the lab, Catherine enjoys figure skating, snowboarding and reading.
- name: Priscila Cavassin
  role: Postdoctoral researcher
  group: postdoc
  email: priscila.cavassin@northwestern.edu
  photo: priscila-cavassin.jpg
  website: https://www.linkedin.com/in/cavassinp
  bio: >
    Priscila joined the Rivnay Group in 2024 as an MRSEC Postdoctoral Scholar. She earned her M.Sc. in Applied Physics from the University of São Paulo in 2019. She then moved to Switzerland and obtained her PhD in Chemistry from the University of Bern. Her research focuses on understanding fundamental properties of conjugated polymers and 2D materials, using different characterization techniques to explore them. In her free time, she likes studying music and playing the flute or being outdoors.
- name: Yebin Lee
  role: Postdoctoral researcher
  group: postdoc
  email: yebin.lee@northwestern.edu
  photo: yebin-lee.jpg
  website: http://www.linkedin.com/in/yebin-lee-4647418b
  bio: >
    Yebin Lee obtained her B.Eng. in Chemical Engineering and MASc in Chemical Engineering and Materials Science from Chung-Ang University, Korea. From 2013 to 2017, she worked as an engineer for Samsung Display Co., Ltd., Korea, and developed flexible display modules. She then moved to Canada and received a Ph.D. in Chemical Engineering (Nanotechnology) from the University of Waterloo in 2022 under the supervision of Prof. Michael Tam. During her Ph.D. study, Yebin focused on the surface engineering of sustainable nanomaterials and applied them to various advanced applications. After receiving her Ph.D. degree, she held a postdoctoral position at the same research group, during which she applied her specialties to various templates for practical applications. Yebin joined the Rivnay Group as a postdoctoral fellow at Northwestern University in 2024. Currently, her work is focused on developing resilient electrochemical aptamer-based biosensors. Her current research interests include a fundamental understanding of surface chemistry and materials science to overcome fouling and degradation issues of biosensors in biological environments. In her free time, she likes running, reading, writing, and playing board games.
- name: Daeyeon Won
  role: Postdoctoral researcher
  group: postdoc
  email: daeyeon.won@northwestern.edu
  photo: daeyeon-won.jpg
  website: http://www.linkedin.com/in/daeyeon-won-2a362523b
  bio: >
    Daeyeon earned dual B.S. degrees in Civil Engineering and Mechanical Engineering from Korea University, South Korea. He began his research career in Prof. Seung Hwan Ko’s group at Seoul National University, where he developed fabrication processes to enhance the properties of conducting polymers through laser–material interactions. He then worked as a Staff Engineer at the Semiconductor R&D Center of Samsung Electronics, developing fabrication processes for EUV photomasks. In 2025, he was awarded a postdoctoral fellowship from the National Research Foundation (NRF) of Korea and joined the Rivnay Group. His current research focuses on developing fabrication strategies to improve the performance of organic semiconductors and biohybrid electronic devices.
- name: Rachel Daso
  role: Postdoctoral researcher
  group: postdoc
  email: racheldaso2027@u.northwestern.edu
  photo: rachel-daso.jpg
  bio: >
    Rachel graduated from Fordham University in 2021 with a B.S. in Chemistry. During her time as an undergraduate, Rachel researched under Dr. Ipsita Banerjee, where she developed peptide-based nanoparticles for applications in tissue regeneration. Rachel joined Northwestern’s Biomedical Engineering PhD program in 2021 and graduated from the Rivnay Group in 2026. Her current research interests involve the development of hybrid conductive nerve allografts with incorporated thin-film electronics for applications in neural tissue monitoring and regeneration. In her spare time, she likes to play board games, read, and rock climb.
- name: Anna Baur
  role: PhD student
  group: phd
  email: annabaur2030@u.northwestern.edu
  photo: anna-baur.jpg
  bio: >
    Anna graduated from the University of Kentucky in 2025 with a B.S. in Biomedical Engineering. As an undergraduate, she researched macrophage physiology following spinal cord injury. Anna joined Northwestern's Biomedical Engineering PhD program and the Rivnay Group in 2025. Her current research focuses on organic bioelectronic platforms for controlled ionic delivery and electrically active biomaterials. In her spare time, she enjoys rock climbing, playing her piano, and enjoying the Chicago food scene.
- name: Quinn Beato
  role: PhD student
  group: phd
  email: quinnbeato2029@u.northwestern.edu
  photo: quinn-beato.jpg
  website: https://quinnbeato.com/
  bio: >
    Quinn earned his B.S. in Biomedical Engineering and B.A. in Philosophy at the University of Colorado Boulder in 2024. He began his undergraduate career with research on the mechanobiology of neuronal chromatin under Dr. Corey Neu, but migrated to Dr. Robert McLeod's lab to study the biosensing applications of Organic Electrochemical Transistors in agriculture and bioastronautics. He also worked as an Emergency Medical Technician for 2 years through Stadium Medical. In the Rivnay Group, his research interests include investigating the application of OMIECs to integrate neuromorphic circuits and point-of-care sensing. Outside of the lab, he enjoys skiing, backpacking, bouldering, reading, and running.
- name: Daniel Duplessis
  role: PhD student
  group: phd
  email: isaiahduplessis2026@u.northwestern.edu
  photo: daniel-duplessis.jpg
  bio: >
    Isaiah Daniel Duplessis earned his B.S. degrees in Physics and Chemistry from the University of Richmond in 2020. During his undergraduate career, his research focused on cross-coupling catalysts. He joined the Materials Science and Engineering department in 2020, and his current work focuses on adapting conductive oxide materials for use in bioelectronics. His hobbies are following the NBA, playing fighting games with his friends, and listening to pop and house music.
- name: Victoria Kindratenko
  role: PhD student
  group: phd
  email: victoriakindratenko2028@u.northwestern.edu
  photo: victoria-kindratenko.jpg
  website: https://www.linkedin.com/in/victoria-kindratenko/
  bio: >
    Victoria graduated from the University of Illinois at Urbana-Champaign in 2023 with a B.S. in Bioengineering. During her undergraduate career, Victoria worked in Dr. Rashid Bashir's Laboratory of Integrated Biomedical Micro/Nanotechnology and Applications. She worked with microfluidics-based point-of-care diagnostic devices for the detection of various conditions including sepsis, COVID-19, Zika, and breast cancer. Victoria's primary interests are using electrochemical aptamer-based biosensors for diagnostic purposes in implantable devices. She is currently exploring the chemistry involved in creating anti-fouling surfaces to improve the longevity of the sensors in biological environments. In her free time, she likes to paint, knit, and bake.
- name: Albert Lai
  role: PhD student
  group: phd
  email: polai2030@u.northwestern.edu
  photo: albert-lai.jpg
  website: http://www.linkedin.com/in/albert-lai-
  bio: >
    Albert earned his B.S. and M.S. degrees in Chemical Engineering from National Cheng Kung University, Taiwan, where he conducted research on nanocomposite hydrogels and ionogels for 3D printing and wearable sensors in Prof. Sheng-Sheng Yu’s lab. He then worked as an R&D engineer at TSMC for two years, developing epitaxy processes for the 1.4 nm node. His current research focuses on the fundamental studies of mixed ionic–electronic conductors, using advanced characterization techniques to investigate the structure–property relationships of conjugated polymers and 2D materials. Outside of the lab, Albert enjoys the simple pleasures of life—finding a quiet corner in a local cafe, catching a movie, or experimenting with new recipes in the kitchen. He also stays active through traveling, working out, and following sports.
- name: Zachary Laswick
  role: PhD student
  group: phd
  email: ZacharyLaswick2027@u.northwestern.edu
  photo: zachary-laswick.jpg
  bio: >
    Zachary graduated from Lehigh University in 2021 with a B.S. in Integrated Natural Science and Engineering. During his time as an undergraduate, Zach researched under Dr. Julie Haas, where he studied connections in the brain and developed computer models for networks of neurons. Zach joined Northwestern’s Biomedical Engineering PhD program in 2022. His current research interests involve the development of neuromorphic circuits and synaptic OECTs. In his spare time, he likes to hike, read, and play board games and video games.
- name: Junyi Liu
  role: PhD student
  group: phd
  email: junyiliu2028@u.northwestern.edu
  photo: junyi-liu.jpg
  website: https://www.linkedin.com/in/bobbyliu123/
  bio: >
    Junyi graduated from the University of Wisconsin–Madison in 2023 with a B.S. in Materials Science and Engineering and a double major in Chemistry. His undergraduate research focused on computational phase field modeling and designing piezoelectric materials under Dr. Jiamian Hu. Junyi joined the Rivnay Group as a PhD student in Materials Science and Engineering in 2023. His current work involves the materials design and fabrication of implantable oxygen sensors and oxygenation devices. In his free time, he enjoys cooking, playing board games, studying music, and exploring fun places in the city.
- name: Royall McMahon Ward
  role: PhD student
  group: phd
  email: royallmcmahonward2024@u.northwestern.edu
  photo: royall-mcmahon-ward.jpg
  bio: >
    Royall graduated from Fordham University in 2022 with a B.S. in Environmental Science and a mathematics minor. During her undergraduate career, she worked with horseshoe crabs researching parasitism and the trophic transfer of microplastics from horseshoe crabs to shorebirds. Post-undergrad, Royall worked in a systems neuroscience lab at NYU under Dr. Constantinople, where she conducted electrophysiology recordings in the secondary visual cortex and the dorsomedial striatum. Royall joined the Rivnay Group in 2026, where her current research focuses on protective coatings for electrochemical aptamer-based sensors. Outside of the lab, Royall enjoys running, sewing, and playing with her two cats.
- name: Zaina Mosalam
  role: PhD student
  group: phd
  email: zainamosalam2030@u.northwestern.edu
  photo: zaina-mosalam.jpg
  bio: >
    Zaina earned her B.S. in Materials Science and Engineering in 2025 from Cornell University. As an undergraduate, she worked under Professor Eve Donnelly on FTIR spectroscopy of diabetic patients and biochemical assay analysis of fluorescent collagen crosslinks in patients who have undergone total knee arthroplasty. She joined Northwestern as a PhD student in Materials Science and Engineering in 2025. As a joint student with professors Jonathan Rivnay and Shana Kelley, she is working to optimize aptamer-based biosensors for different proteins and molecules. In her free time, she enjoys going to the gym, crocheting, and learning languages.
- name: Zander Schwartz
  role: PhD student
  group: phd
  email: zanderschwartz2030@u.northwestern.edu
  photo: zander-schwartz.jpg
  website: http://linkedin.com/in/zander-schwartz
  bio: >
    Zander earned his B.E. in Biomedical Engineering from Vanderbilt University in 2025, with a double major in Medicine, Health, and Society. As an undergraduate, he conducted research under Dr. Ethan Lippmann, using in vitro models to study the progression of Alzheimer’s disease in stem cell cultures. Zander joined the Rivnay Group in 2025, where his current research focuses on electrochemical aptamer-based sensors for diagnostic applications in implantable devices. Outside of lab, Zander enjoys playing music, going to concerts, hiking, traveling, and trying new food.
- name: John Williams
  role: PhD student
  group: phd
  email: johnwilliams2019@u.northwestern.edu
  photo: john-williams.jpg
  website: https://www.linkedin.com/in/john-williams-work/
  bio: >
    John earned his MS and BS from Northwestern in the departments of Electrical Engineering and Manufacturing and Design Engineering, respectively. His passion for cutting-edge health technology led him to the Rivnay Group, in which he develops biomolecular sensors for lab-grown tissues, which are robust tools to study inflammation. Beyond the lab, he spends his time at the gym, producing music, and reading.
- name: Liangying Chen
  role: Master's student
  group: masters
  photo: liangying-chen.jpg
  bio: >
    Liangying graduated from National Taiwan University in 2025 with a B.S. in Chemical Engineering. During her undergraduate studies, she worked on perovskite light-emitting diodes (PeLEDs). Liangying joined the Rivnay Group as a master’s student in Materials Science & Engineering in 2026. Her current research focuses on organic electrochemical transistor (OECT)-based pH sensors. Outside of the lab, Liangying enjoys running, working out, and listening to music.
- name: Ziyi Liu
  role: Master's student
  group: masters
  photo: ziyi-liu.jpg
  bio: >
    Ziyi earned his B.S. in Polymer Materials and Engineering from Beijing University of Chemical Technology in 2025. During his undergraduate studies, he worked with Dr. Qingsheng Liu on anti-foreign-body PDMS for reusable medical catheter applications. Ziyi joined the Rivnay Group as an MS student in Materials Science and Engineering in 2025. His current research focuses on the fabrication of transparent, photo-responsive OECTs. Outside the lab, Ziyi enjoys hiking, sports, and video games.
- name: Julia Ostrander
  role: Master's student
  group: masters
  photo: julia-ostrander.jpg
  bio: >
    Julia is currently a senior undergraduate BME student at Northwestern, pursuing a Master's degree through the BME BS/MS program. As an undergraduate, she has worked in the Quinlan Lab at the University of Utah studying the heritability of mutation rate, and in the Center for Bionic Medicine at the Shirley Ryan AbilityLab, developing a facial recognition program to blur infant faces in videos used to study cerebral palsy risk. She joined the Rivnay Group in 2025, where she works on characterizing conductive hydrogels for sensing and drug delivery applications. In her free time, she enjoys running, hiking, watching soccer, and painting.
- name: Beliz Utebay
  role: Master's student
  group: masters
  email: butebay@u.northwestern.edu
  photo: beliz-utebay.jpg
  bio: >
    Beliz earned her B.S. in Chemical and Biomolecular Engineering with a minor in Biomedical Engineering from Georgia Institute of Technology in 2023. During the first two years of her undergrad, she worked in Coskun Lab at Georgia Tech on spatial organizations of cells. Later, she joined Stingelin Lab at Georgia Tech, where she worked with hybrid hydrogels to study their structure–property relationship and mechanical properties until she graduated. She joined Northwestern as a master's student in Materials Science and Engineering in 2023. Her research in the lab focuses on lipid-bilayer sensing. In her free time, she enjoys playing instruments, singing, and photography.
- name: Ella Spena
  role: Undergraduate student
  group: undergrad
  photo: ella-spena.jpg
  bio: >
    Ella Spena is an undergraduate who started at Northwestern in Fall 2024, pursuing a B.S. in Biomedical Engineering. She joined the Rivnay Group in 2025 and is now working on how conductive materials can be used as biohybrid actuators as well as how the macroscopic orientation of the conductive materials can impact tissue maturation. Ella rows for the Northwestern club crew team and enjoys hiking, running, and reading in her free time.
- name: Shwe Yee Phu
  role: Undergraduate student
  group: undergrad
  photo: shwe-yee-phu.jpg
  bio: >
    Shwe Yee is an undergraduate student at Northwestern University pursuing a B.S. in Biomedical Engineering with a minor in Business Institutions. She has a strong interest in biosensors and is currently conducting research in the Rivnay Group, where she works on biosensors and investigates antifouling surface strategies to improve device performance. Outside the lab, Shwe Yee enjoys crocheting, learning new musical instruments, and experimenting with new recipes.
